version: 0.13.1
description: A RAM stress test tool for Windows
homepage: https://github.com/CoolCmd/TestMem5
license:
  identifier: Freeware
  url: https://github.com/CoolCmd/TestMem5
url: https://github.com/CoolCmd/TestMem5/releases/download/v0.13.1/TestMem5.7z
hash: 05ffb5bbaa0c2243bf25664049c7aa3615a77bd5036497ef845fc8ed50128c12
pre_install: |
  'TM5.ini', 'Log.txt' | ForEach-Object {
    if (-not (Test-Path "$dir\$_")) { New-Item -ItemType File -Path "$dir\$_" | Out-Null }
  }
shortcuts:
- - TM5.exe
  - TestMem5
persist:
- TM5.ini
- Log.txt
notes: |
  TM5.exe has to be started as Administrator. Without elevation it cannot lock the
  memory under test (SeLockMemoryPrivilege), which weakens the test and lets Windows
  page the test window out.
  Known false positive: the author documents that some antivirus engines, including
  Microsoft Defender, flag TM5.exe because the program is written in assembly.
checkver:
  github: https://github.com/CoolCmd/TestMem5
autoupdate:
  url: https://github.com/CoolCmd/TestMem5/releases/download/v$version/TestMem5.7z
