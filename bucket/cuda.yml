version: 13.5.0
description: A parallel computing platform and programming model invented by NVIDIA.
homepage: https://developer.nvidia.com/cuda-toolkit
license:
  identifier: Freeware
  url: https://docs.nvidia.com/cuda/eula/index.html
url: https://developer.download.nvidia.com/compute/cuda/13.5.0/local_installers/cuda_13.5.0_windows_x86_64.exe#/dl.7z
hash: md5:7edd4d268e61571e06fe13acb676ce0d
installer:
  script: |
    $names = @(Get-ChildItem -Path "$dir" -Directory -Name -Depth 2 | Where-Object
    {$_ -match ".*(?<!cuda_samples)\\.*\\(?:bin|compute-sanitizer|extras|include|lib|libnvvp|nvml|nvvm|12.4.0_551.61nvvm-prev|src)$"})
    foreach ($name in $names) {
      Copy-Item "$dir\$name" "$dir" -Recurse -Force'
    }
    Get-ChildItem "$dir" -Exclude ('bin', 'compute-sanitizer', 'extras', 'include', 'lib', 'libnvvp', 'nvml', 'nvvm', 'nvvm-prev', 'src', 'version.json') | Remove-Item -Recurse -Force
env_add_path:
- bin
- libnvvp
env_set:
  CUDA_PATH: $dir
checkver:
  url: https://developer.nvidia.com/cuda-toolkit-archive
  regex: CUDA Toolkit\s*(\d[\d.]+)
autoupdate:
  url: https://developer.download.nvidia.com/compute/cuda/$version/local_installers/cuda_$version_windows_x86_64.exe#/dl.7z
  hash:
    url: https://developer.download.nvidia.com/compute/cuda/$version/docs/sidebar/md5sum.txt
