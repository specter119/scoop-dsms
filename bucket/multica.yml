    hash: sha512:15f9069447c9a7bfcc037b24bf441d65770ae30fa4b8eb80feb95125e1062f99d5579f2c473302f8908d132a3c9fe2e965b1abe2809337067ce76739b75939fa
    pre_install:
    - Expand-7zipArchive $dir/`$PLUGINSDIR/app-64.7z $dir -Removal
    - Remove-Item "$dir\`$PLUGINSDIR", "$dir\`$R0", "$dir\uninstallerIcon.ico" -Recurse -Force -ErrorAction SilentlyContinue
  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.5.3/multica-desktop-0.5.3-windows-arm64.exe#/dl.7z
    hash: sha512:f6fef0f2d6e1f0574935a13c2d2c66a2ef4894e5f1d8c59d40691a9f9af4a1f60f1767160a7201320562f2ae43ee732d298825a9c3bad99d894525ff4637adbf
    pre_install:
    - Expand-7zipArchive $dir/`$PLUGINSDIR/app-arm64.7z $dir -Removal
    - Remove-Item "$dir\`$PLUGINSDIR", "$dir\`$R0", "$dir\uninstallerIcon.ico" -Recurse -Force -ErrorAction SilentlyContinue
shortcuts:
- - Multica.exe
  - Multica
checkver:
  github: https://github.com/multica-ai/multica
autoupdate:
  architecture:
    64bit:
      url: https://github.com/multica-ai/multica/releases/download/v$version/multica-desktop-$version-windows-x64.exe#/dl.7z
      hash:
        url: $baseurl/latest.yml
        regex: sha512:\s+$base64
