  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.6.5/multica-desktop-0.6.5-windows-arm64.exe#/dl.7z
    hash: sha512:89eb717b693de1ae67124157523dbe2ed2234b917b4193914847ed16dd4d9e0837243c3ae491ae8b1659b4c1512dca7a4204e16e3f8893a57b77438e9b703087
