  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.4.21/multica-desktop-0.4.21-windows-arm64.exe#/dl.7z
    hash: sha512:99633f7de30b78575d9b9e4f2b5b7076125437b3f07f6d6faae4cc0c7d83469a7422cb478a75f075e78135a78acd6cfec93eef0e8b224a204c01589eefa0431a
