  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.6.2/multica-desktop-0.6.2-windows-arm64.exe#/dl.7z
    hash: sha512:b1c6c832985d2dfc89cb0bb8bb6301d2c7128e49da08ff70f83e7b7012573696620da989fbc08e4369abf97053e3c0b78e9942e07dd3c16a0af91cd349c3e814
