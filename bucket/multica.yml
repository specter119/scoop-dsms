  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.4.25/multica-desktop-0.4.25-windows-arm64.exe#/dl.7z
    hash: sha512:dd79e141fd3e58c0424957fbced87ee9a95547c5a3ec4f6c1a6a13c9a73f0b3428f671868d478ec94112cf5d6db4a33e8d305b24947df05a7fa2c72888a23bf8
