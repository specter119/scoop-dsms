  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.7.1/multica-desktop-0.7.1-windows-arm64.exe#/dl.7z
    hash: sha512:dbc8c549a7f75cd68a1a008aade72739414d57b1fe6920516ba30a1d5c0f0e9141b4f8f3e1a71f54742168c07b6dc2a2a2f702129f4c22a5f1f42e3ebd27a46c
