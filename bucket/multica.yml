    hash: sha512:a1299d5ae5b93bf65fc4cc7a4202b8c57345cd172428a1de4b8603095b25349ebec557019988023a8044ab13990a56567cee83ed3b4eddb1fd5b7f6eecc869f0
    pre_install:
    - Expand-7zipArchive $dir/`$PLUGINSDIR/app-64.7z $dir -Removal
