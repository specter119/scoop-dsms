  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.4.38/multica-desktop-0.4.38-windows-arm64.exe#/dl.7z
    hash: sha512:cc8acda53e31d279ac4cf0f42b5ce7ef2571502cd5d534ebcf06dc64f51e9b74f9fa600cc86180a73bf595545b92d5c02d6d1c725f52e23fa7e03781556f4105
