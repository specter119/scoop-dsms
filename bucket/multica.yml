  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.4.32/multica-desktop-0.4.32-windows-arm64.exe#/dl.7z
    hash: sha512:217e1e52440c267d818a82180d42aa98257841a6c112cbeda43fed52e2c8bc6b62556ec7b2f0be8ec921b1926426e0a1b00843a46f8352df9402ceb6e8903d84
