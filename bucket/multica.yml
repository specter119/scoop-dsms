  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.6.3/multica-desktop-0.6.3-windows-arm64.exe#/dl.7z
    hash: sha512:d2286da501b633ab09ba663e31378478c02a9300ffe69aa5a6d8d972153984fc64fb482371a726d8694a8eac48eba9d03332808a6fbcb2557ea1ca48ca550b6a
