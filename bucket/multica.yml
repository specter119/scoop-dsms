  arm64:
    url: https://github.com/multica-ai/multica/releases/download/v0.5.1/multica-desktop-0.5.1-windows-arm64.exe#/dl.7z
    hash: sha512:79bfa8cd68cb47ac4bdeb6b181849150b1f91fde8d0defad8c430c861b7e6d8e7883a021d8ce36067e446d225d9d48369c1a0c20879079e652644b30fc2a2989
